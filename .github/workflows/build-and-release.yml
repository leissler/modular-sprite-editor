name: Build And Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (example: 0.2)"
        required: true
        default: "0.2"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        if: runner.os != 'Linux'
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-pip \
            python3-wxgtk4.0 \
            libgtk-3-dev \
            libnotify-dev \
            libsdl2-dev \
            libsm-dev \
            libxtst-dev \
            libxrender-dev \
            libxext-dev \
            libjpeg-dev \
            libtiff-dev \
            libgstreamer1.0-dev \
            libgstreamer-plugins-base1.0-dev

      - name: Install dependencies
        if: runner.os != 'Linux'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Install Linux Python dependencies
        if: runner.os == 'Linux'
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install Pillow pyinstaller

      - name: Build macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist/mac --workpath build/mac build_mac.spec
          if [ -d "dist/mac/ModularSpriteEditor" ]; then
            rm -rf dist/mac/ModularSpriteEditor
          fi
          cd dist/mac
          ditto -c -k --sequesterRsrc --keepParent ModularSpriteEditor.app ModularSpriteEditor-macos.zip

      - name: Build Windows exe
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist/windows --workpath build/windows build_windows.spec
          Compress-Archive -Path "dist/windows/ModularSpriteEditor.exe" -DestinationPath "dist/windows/ModularSpriteEditor-windows.zip" -Force

      - name: Build Linux binary
        if: runner.os == 'Linux'
        run: |
          python3 -m PyInstaller --clean --noconfirm --distpath dist/linux --workpath build/linux build_linux.spec
          cd dist/linux
          if [ -f "ModularSpriteEditor" ]; then
            tar -czf ModularSpriteEditor-linux.tar.gz ModularSpriteEditor
          elif [ -d "ModularSpriteEditor" ]; then
            tar -czf ModularSpriteEditor-linux.tar.gz ModularSpriteEditor
          else
            echo "Linux build output not found"
            exit 1
          fi

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ModularSpriteEditor-macos
          path: dist/mac/ModularSpriteEditor-macos.zip

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ModularSpriteEditor-windows
          path: dist/windows/ModularSpriteEditor-windows.zip

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: ModularSpriteEditor-linux
          path: dist/linux/ModularSpriteEditor-linux.tar.gz

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Show assets
        run: find release-assets -maxdepth 3 -type f -print

      - name: Create/Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: |
            release-assets/ModularSpriteEditor-macos/ModularSpriteEditor-macos.zip
            release-assets/ModularSpriteEditor-windows/ModularSpriteEditor-windows.zip
            release-assets/ModularSpriteEditor-linux/ModularSpriteEditor-linux.tar.gz
