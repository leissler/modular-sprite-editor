name: Build And Release

# Builds the editor and the SGDK exporter for macOS, Windows and Linux and tests every build: unit tests, the
# built editor drives every tab against both example projects (--smoke-test), the built exporter must write
# exactly what the Python exporter writes. The release gets the editor and the exporter for each platform, and
# the example projects (ModularSpriteEditor-examples.zip, made by the Linux job).
# On Windows it also assembles and tests the kit to hand to a developer directly (not released, a run
# artifact): editor, exporter, examples and the SGDK demo, built into ROMs with the bundled SGDK.
# With "publish" off it only builds and tests. The version has to be APP_VERSION in app.py (the About box shows it).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag (example: 0.4)"
        required: true
        default: "0.4"
      publish:
        description: "Publish the GitHub release (off: build and test only)"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30  # a run takes under 10; the smoke test ends a hung step itself after 3 minutes
    strategy:
      fail-fast: false
      matrix:
        # Linux on the oldest supported Ubuntu: the binary needs a glibc at least as new as the build's.
        os: [macos-latest, windows-latest, ubuntu-22.04]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the version
        shell: bash
        run: |
          app_version=$(python -c "import re; print(re.search(r'^APP_VERSION = \"(.*)\"', open('app.py', encoding='utf-8').read(), re.M).group(1))")
          if [ "$app_version" != "${{ github.event.inputs.version }}" ]; then
            echo "::error::app.py has APP_VERSION = \"$app_version\", this run releases ${{ github.event.inputs.version }}: update APP_VERSION first"
            exit 1
          fi

      - name: Install Linux system packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libnotify4 libsdl2-2.0-0 libsm6 libxtst6 xvfb xauth

      # No Linux wheels on PyPI: wxPython's own build for this Ubuntu, cached (its server is slow at times).
      - name: Cache the Linux wxPython wheel
        if: runner.os == 'Linux'
        uses: actions/cache@v4
        with:
          path: wheels
          key: wxpython-4.2.5-cp311-ubuntu-22.04

      - name: Install Python packages
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "$RUNNER_OS" = "Linux" ]; then
            wheel=wheels/wxpython-4.2.5-cp311-cp311-linux_x86_64.whl
            if [ ! -f "$wheel" ]; then
              mkdir -p wheels
              curl -fL --retry 6 --retry-delay 20 --retry-all-errors --max-time 600 -o "$wheel" \
                "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-22.04/$(basename "$wheel")"
            fi
            python -m pip install "$wheel"
          else
            python -m pip install --only-binary wxPython wxPython==4.2.5
          fi
          python -m pip install Pillow pyinstaller pytest

      - name: Unit tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a python -m pytest -q tests
          else
            python -m pytest -q tests
          fi

      - name: Build and test the SGDK exporter
        shell: bash
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist/exporter --workpath build/exporter build_sgdk_exporter.spec
          exe=dist/exporter/export_sgdk
          if [ "$RUNNER_OS" = "Windows" ]; then exe=$exe.exe; fi
          for project in examples/sgdk/PoP_WW.json examples/sonic/sonic.json; do
            name=$(basename "$project" .json)
            "$exe" --project-json "$project" --output-demo-dir "exporter-test/exe/$name" --mapping all
            python examples/sgdk/tools/export_sgdk_example.py --project-json "$project" \
              --output-demo-dir "exporter-test/py/$name" --mapping all > /dev/null
            diff -r "exporter-test/exe/$name" "exporter-test/py/$name"
          done
          mkdir -p dist/release
          case "$RUNNER_OS" in
            macOS) (cd dist/exporter && zip -q ../release/export_sgdk-macos.zip export_sgdk) ;;
            Linux) tar -czf dist/release/export_sgdk-linux.tar.gz -C dist/exporter export_sgdk ;;
            Windows) python -m zipfile -c dist/release/export_sgdk-windows.zip dist/exporter/export_sgdk.exe ;;
          esac

      - name: Build and test macOS app
        if: runner.os == 'macOS'
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist/mac --workpath build/mac build_mac.spec
          rm -rf dist/mac/ModularSpriteEditor
          mkdir -p test-results
          for project in examples/sgdk/PoP_WW.json examples/sonic/sonic.json; do
            log="test-results/smoke-$(basename "$project" .json).log"
            dist/mac/ModularSpriteEditor.app/Contents/MacOS/ModularSpriteEditor --smoke-test "$PWD/$project" "$log" \
              || { cat "$log"; exit 1; }
            tail -n 1 "$log"
          done
          (cd dist/mac && ditto -c -k --sequesterRsrc --keepParent ModularSpriteEditor.app ../release/ModularSpriteEditor-macos.zip)

      - name: Build and test Linux binary
        if: runner.os == 'Linux'
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist/linux --workpath build/linux build_linux.spec
          mkdir -p test-results
          for project in examples/sgdk/PoP_WW.json examples/sonic/sonic.json; do
            log="test-results/smoke-$(basename "$project" .json).log"
            xvfb-run -a dist/linux/ModularSpriteEditor --smoke-test "$PWD/$project" "$log" || { cat "$log"; exit 1; }
            tail -n 1 "$log"
          done
          tar -czf dist/release/ModularSpriteEditor-linux.tar.gz -C dist/linux ModularSpriteEditor

      - name: Zip the example projects
        if: runner.os == 'Linux'
        run: python tools/make_examples_zip.py dist/release/ModularSpriteEditor-examples.zip --version "${{ github.event.inputs.version }}"

      - name: Build Windows exe and kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --clean --noconfirm --distpath dist/windows --workpath build/windows build_windows.spec
          Compress-Archive -Path dist/windows/ModularSpriteEditor.exe -DestinationPath dist/release/ModularSpriteEditor-windows.zip
          python tools/make_windows_kit.py dist/windows/ModularSpriteEditor.exe dist/exporter/export_sgdk.exe `
            "dist/kit/ModularSpriteEditor-${{ github.event.inputs.version }}-windows-kit.zip" --version "${{ github.event.inputs.version }}"

      - name: Setup Java (SGDK's resource compiler)
        if: runner.os == 'Windows'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Test the Windows exe and kit
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Unpack the kit like a user would and use only what is inside.
          $results = New-Item -ItemType Directory -Force test-results
          Expand-Archive (Get-Item dist/kit/*.zip) -DestinationPath C:\kittest
          $kit = "C:\kittest\ModularSpriteEditor-windows"
          foreach ($project in "examples\sgdk\PoP_WW.json", "examples\sonic\sonic.json") {
            $log = Join-Path $results ("smoke-" + [IO.Path]::GetFileNameWithoutExtension($project) + ".log")
            $run = Start-Process "$kit\ModularSpriteEditor.exe" -ArgumentList "--smoke-test", "$kit\$project", $log -Wait -PassThru
            Get-Content $log -Tail 1
            if ($run.ExitCode -ne 0) { Get-Content $log; exit 1 }
          }
          # The ROM from the data in the kit (PoP_WW), then export Sonic and build again.
          cmd /c "$kit\build_sgdk_demo.bat"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$kit\examples\sgdk\sgdk_demo\out\debug\rom.bin" (Join-Path $results "rom-PoP_WW.bin")
          cmd /c "$kit\export_to_sgdk.bat" "$kit\examples\sonic\sonic.json"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Copy-Item "$kit\examples\sgdk\sgdk_demo\out\debug\rom.bin" (Join-Path $results "rom-sonic.bin")
          Get-ChildItem $results

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ runner.os }}
          path: dist/release/*

      - name: Upload Windows kit (not released)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: windows-kit
          path: dist/kit/*.zip

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ runner.os }}
          path: test-results
          if-no-files-found: ignore

  release:
    name: Publish Release
    needs: build
    if: ${{ github.event.inputs.publish == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Show assets
        run: ls -l release-assets

      - name: Create/Update GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: ${{ github.event.inputs.version }}
          generate_release_notes: true
          overwrite_files: true
          files: release-assets/*
