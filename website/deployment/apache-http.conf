<VirtualHost *:80>
    ServerName modularsprites.bionic-productions.com
    DocumentRoot /var/www/modularsprites.bionic-productions.com/current

    Alias /.well-known/acme-challenge/ /var/www/modularsprites.bionic-productions.com/acme/.well-known/acme-challenge/
    <Directory /var/www/modularsprites.bionic-productions.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/modularsprites-error.log
    CustomLog ${APACHE_LOG_DIR}/modularsprites-access.log combined

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://modularsprites.bionic-productions.com%{REQUEST_URI} [R=301,L,NE]
</VirtualHost>
