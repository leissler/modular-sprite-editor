<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName modularsprites.bionic-productions.com
    DocumentRoot /var/www/modularsprites.bionic-productions.com/current

    <Directory /var/www/modularsprites.bionic-productions.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorDocument 404 /404.html

    # Every file is checked for a new version on each visit (cheap thanks to the ETag), so a deploy shows at once.
    # Material's build files carry a content hash in their name and never change.
    <IfModule mod_headers.c>
        Header set Cache-Control "no-cache"
        <FilesMatch "\.[0-9a-f]{8}\.min\.(css|js)$">
            Header set Cache-Control "public, max-age=31536000, immutable"
        </FilesMatch>
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/modularsprites-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/modularsprites-ssl-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/modularsprites.bionic-productions.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/modularsprites.bionic-productions.com/privkey.pem
</VirtualHost>
</IfModule>
