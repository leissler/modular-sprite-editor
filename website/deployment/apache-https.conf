<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName modularsprites.bionic-productions.com
    DocumentRoot /var/www/modularsprites.bionic-productions.com/current

    <Directory /var/www/modularsprites.bionic-productions.com>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    ErrorDocument 404 /404.html

    ErrorLog ${APACHE_LOG_DIR}/modularsprites-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/modularsprites-ssl-access.log combined

    Include /etc/letsencrypt/options-ssl-apache.conf
    SSLCertificateFile /etc/letsencrypt/live/modularsprites.bionic-productions.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/modularsprites.bionic-productions.com/privkey.pem
</VirtualHost>
</IfModule>
